<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find Your Next Role — Hero</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #f4f4f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .hero {
    max-width: 720px;
    text-align: left;
  }
  .quote {
    font-size: 2.4rem;
    font-weight: 500;
    line-height: 1.25;
    margin: 0 0 24px 0;
    min-height: 140px;
  }
  .status {
    font-size: 1.35rem;
    color: #a1a1aa;
    margin: 0 0 32px 0;
    min-height: 60px;
    transition: opacity 0.4s ease;
  }
  .cta {
    font-size: 1.1rem;
    color: #e4e4e7;
    line-height: 1.5;
  }
  .cta strong {
    color: #fff;
    font-weight: 600;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #fff;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="hero">
    <p class="quote" id="quote">If I’m not a Director anymore, who am I?<span class="cursor"></span></p>
    <p class="status" id="status">I’m still in the role and quietly looking.</p>
    <p class="cta">
      <strong>Find Your Next Role</strong> helps you claim your strengths, aim at roles the market pays for, and run a search that doesn’t depend on the old title.
    </p>
  </div>

<script>
const quotes = [
  "If I’m not a Director anymore, who am I?",
  "If I’m not a Head of anymore, who am I?",
  "If I’m not a VP anymore, who am I?",
  "I keep applying and nothing lands.",
  "I don’t know how to talk about myself without the old title."
];

const statuses = [
  "I’m still in the role and quietly looking.",
  "I’m thinking of leaving and don’t know where to start.",
  "I’ve already left and nothing is landing.",
  "I’m trying to figure out a fractional or portfolio path.",
  "I’m scared this will be a step down."
];

let qIndex = 0;
let sIndex = 0;

function rotate() {
  const quoteEl = document.getElementById("quote");
  const statusEl = document.getElementById("status");

  // Fade out
  quoteEl.style.opacity = 0;
  statusEl.style.opacity = 0;

  setTimeout(() => {
    qIndex = (qIndex + 1) % quotes.length;
    sIndex = (sIndex + 1) % statuses.length;

    quoteEl.innerHTML = quotes[qIndex] + '<span class="cursor"></span>';
    statusEl.textContent = statuses[sIndex];

    // Fade in
    quoteEl.style.opacity = 1;
    statusEl.style.opacity = 1;
  }, 400);
}

// Initial opacity
document.getElementById("quote").style.transition = "opacity 0.4s ease";
document.getElementById("status").style.transition = "opacity 0.4s ease";

setInterval(rotate, 3800);
</script>
</body>
</html>
